[project]
name = "database-query-optimizer"
version = "1.0.0"
description = "PostgreSQL SQL & EXPLAIN JSON index advisor using ESR B-Tree rules and AST-style query heuristics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.2.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
